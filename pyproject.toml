[project]
name = "cedro-mcp-server"
version = "0.1.0"
description = "MCP server exposing Cedro Market Data (REST F1) as AI tools"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # mcp 2.x renomeou FastMCP -> MCPServer e mudou APIs incompativelmente; todo o código aqui
    # (server.py, web_login.py, entitlements.py, ...) usa a API 1.x. Sem o teto, qualquer
    # install novo (CI, build de imagem) resolve pro 2.x mais recente e quebra no import.
    "mcp[cli]>=1.2.0,<2",
    "httpx>=0.27",
    "pydantic>=2.6",
    "uvicorn>=0.30",
    "pyjwt[crypto]>=2.8",
    "python-dotenv>=1.0",
    # RSA-OAEP-SHA256 do user-identifier de Trading (trading/identity.py). Já vinha transitivo
    # via pyjwt[crypto], mas dependência transitiva não é garantia de versão — explícita aqui.
    "cryptography>=42",
    # TypedDict de saída das tools de Trading (NotRequired). Transitiva via pydantic, explícita
    # aqui pelo mesmo motivo da cryptography acima.
    "typing-extensions>=4.6",
    # /metrics (metrics.py) — puro Python, sem dependências nativas.
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
# Estado compartilhado entre réplicas (MCP_REDIS_URL — ver store.py). A imagem Docker já instala.
redis = ["redis>=5"]
dev = [
    "pytest>=8.0",
    "respx>=0.21",
    "redis>=5",
    # Redis em memória para os testes de store/login/cota/rate limit entre "réplicas".
    "fakeredis>=2.20",
    # Pinado exato: 0.16 mudou o conjunto de regras padrão (RUF100/C408/ANN001 etc. passaram a
    # rodar) e quebrou CI sem nenhuma mudança de código — ruff ainda é pre-1.0, sem garantia de
    # compat entre minors.
    "ruff==0.15.20",
]

[project.scripts]
cedro-mcp = "cedro_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cedro_mcp"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
