name: Publish Docker image

on:
  push:
    branches: ["master"]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Docker tags precisam ser minúsculos; github.repository_owner preserva o casing
          # ("T4Msy"), por isso o nome vem hardcoded aqui em vez de interpolado.
          tags: ghcr.io/t4msy/cedro-mcp-server:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
